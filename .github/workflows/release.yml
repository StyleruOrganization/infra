name: Release service
run-name: "Release ${{ inputs.project }}/${{ inputs.service }} · ${{ inputs.ref }}"

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name from projects/
        required: true
        default: termeet
        type: string
      service:
        description: Service name from project.json
        required: true
        default: backend
        type: string
      ref:
        description: Application branch, tag or commit
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve project and host
        id: target
        env:
          PROJECT: ${{ inputs.project }}
          SERVICE: ${{ inputs.service }}
          RELEASE_REF: ${{ inputs.ref }}
        run: python3 deploy.py target "$PROJECT" --service "$SERVICE" --ref "$RELEASE_REF" --output "$GITHUB_OUTPUT"

      - name: Require a trusted host fingerprint
        shell: bash
        env:
          FINGERPRINT: ${{ secrets[format('{0}_SSH_FINGERPRINT', steps.target.outputs.secrets_prefix)] }}
        run: |
          if ! [[ "$FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "Set the host SSH fingerprint in this infrastructure repository's secrets."
            exit 1
          fi

      - name: Fetch, build and switch on the server
        uses: appleboy/ssh-action@v1.0.3
        env:
          INFRA_SHA: ${{ github.sha }}
          INFRA_ROOT: ${{ steps.target.outputs.root }}
          PROJECT: ${{ inputs.project }}
          SERVICE: ${{ inputs.service }}
          RELEASE_REF: ${{ inputs.ref }}
        with:
          host: ${{ secrets[format('{0}_HOST', steps.target.outputs.secrets_prefix)] }}
          username: ${{ secrets[format('{0}_USER', steps.target.outputs.secrets_prefix)] }}
          key: ${{ secrets[format('{0}_SSH_PRIVATE_KEY', steps.target.outputs.secrets_prefix)] }}
          fingerprint: ${{ secrets[format('{0}_SSH_FINGERPRINT', steps.target.outputs.secrets_prefix)] }}
          envs: INFRA_SHA,INFRA_ROOT,PROJECT,SERVICE,RELEASE_REF
          command_timeout: 40m
          script: |
            set -eu
            python3 "$INFRA_ROOT/control/dispatch.py" "$INFRA_SHA" release "$PROJECT" "$SERVICE" "$RELEASE_REF"
